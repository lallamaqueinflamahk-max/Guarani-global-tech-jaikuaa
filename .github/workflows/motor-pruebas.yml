# Pruebas automáticas del motor morfológico.
# Corre en cada cambio que toque el motor (de Lovable, de Alan o de Claude) y avisa si algo
# rompe las reglas cargadas del libro antes de publicar el sitio.
name: Pruebas del motor

on:
  push:
    paths:
      - "src/lib/morph/**"
      - "src/routes/_authenticated/laboratorio.tsx"
      - ".github/workflows/motor-pruebas.yml"
  pull_request:
    paths:
      - "src/lib/morph/**"
      - "src/routes/_authenticated/laboratorio.tsx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    name: Reglas del libro (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Correr las pruebas del motor
        run: bunx vitest run src/lib/morph
