# Verifica que el sitio compile (la misma compilación que hace Lovable al publicar)
# y muestra los errores de tipos del motor y del Laboratorio, sin bloquear.
name: Compilación del sitio

on:
  push:
    paths:
      - "src/**"
      - ".github/workflows/compilacion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Compilar
        run: bun run build
      - name: Tamaño del paquete (informativo)
        continue-on-error: true
        run: |
          for d in .output dist; do [ -d "$d" ] && du -sh "$d"/* 2>/dev/null | sed 's/^/::notice::tamaño /'; done
          SERVER=$(ls -d .output/server dist/server 2>/dev/null | head -1)
          if [ -n "$SERVER" ]; then
            echo "::notice::servidor sin comprimir $(du -sb "$SERVER" | cut -f1) bytes; comprimido $(tar -cz -C "$SERVER" . | wc -c) bytes"
            find "$SERVER" -type f -printf '%s %p\n' | sort -rn | head -8 | sed 's/^/::notice::archivo grande /'
          fi
      - name: Tipos (informativo)
        continue-on-error: true
        run: |
          bunx tsc --noEmit -p tsconfig.json 2>&1 \
            | grep -E "src/(lib/morph|routes/_authenticated/(laboratorio|validacion)|lib/(laboratorio|validation-circuit))" \
            | sed -E 's/^([^(]+)\(([0-9]+),[0-9]+\): (.*)$/::warning file=\1,line=\2::\3/' \
            || echo "Sin errores de tipos en el motor, el Laboratorio ni el circuito de validación"
